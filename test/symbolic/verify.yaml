# Verification with plain bit-vector arithmetic. block.timestamp is symbolic in
# [initialTimestamp, initialTimestamp + maxTimeDelay]; 400000 s keeps it inside the
# 604800 s cycle that holds echidna's initialTimestamp (1524785992).
testMode: verification
format: text
symExec: true
symExecMaxIters: 15
symExecMaxExplore: 50
symExecNSolvers: 5
symExecTimeout: 120
symExecAbstractArith: false
maxTimeDelay: 400000
